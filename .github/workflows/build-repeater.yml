name: Build DSL2750U Repeater

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison gperf subversion ncurses-dev libncurses5-dev

      - name: Prepare legacy SDK
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          SDK="$ROOT/RTL8676xx"
          RSDK="$ROOT/rsdk-1.5.6-5281-EB-2.6.30-0.9.30.3-110915"

          cd "$SDK"

          # Normalize old CRLF files before modifying them.
          perl -pi -e 's/\r$//' Makefile tools/mkbuilddir tools/prepareBLP.sh scripts/Makefile

          # These legacy scripts use Bash "source" but are invoked by /bin/sh.
          perl -pi -e 's/^source /. /' tools/mkbuilddir tools/prepareBLP.sh

          # GitHub checkout is not an SVN working copy. The warning is harmless,
          # but remove the exact SVN status command used by ckconfig.
          perl -pi -e 's/SVNST=`svn st \$\$defconfig`;/SVNST=;/' Makefile

          # Fix the old /bin/sh test syntax.
          perl -pi -e 's/\[ -a \.config \]/[ -e .config ]/g' Makefile

          # Remove the obsolete SUID prerequisite from the tools target.
          perl -pi -e 's/^tools: promission_check$/tools:/' Makefile

          # autobuild needs scripts/conf, not interactive mconf.
          perl -pi -e 's/^OBJS = conf mconf$/OBJS = conf/' scripts/Makefile

          # The archive contains prebuilt 32-bit host objects. Delete those
          # objects/binaries so the Ubuntu runner rebuilds host tools natively.
          find tools/src -type f \
            \( -name '*.o' \
            -o -name 'mkimage_ex' \
            -o -name 'mkimage' \
            -o -name 'mksquashfs' \
            -o -name 'lzma' \
            -o -name 'formatcsv' \
            -o -name 'sstrip' \
            -o -name 'mktree' \
            -o -name 'xmltool' \
            -o -name 'xml_flash_tool' \) \
            -delete

          # The Kconfig parser sources are shipped in the archive.
          cp -f scripts/lex.zconf.c_shipped scripts/lex.zconf.c
          cp -f scripts/zconf.tab.c_shipped scripts/zconf.tab.c
          cp -f scripts/zconf.hash.c_shipped scripts/zconf.hash.c

          # The SDK expects this exact bundled toolchain path.
          sudo mkdir -p /opt/tbs_toolchains/realtek
          sudo ln -sfn "$RSDK" \
            /opt/tbs_toolchains/realtek/rsdk-1.5.6-5281-EB-2.6.30-0.9.30.3-110915

          export PATH="$RSDK/bin:$PATH"
          echo "$RSDK/bin" >> "$GITHUB_PATH"

          # Enable the existing RTL8192CD client + Universal Repeater code.
          CFG="$ROOT/customer/product/DSL2750U/defconfig"

          if grep -q '^# CONFIG_RTL_CLIENT_MODE_SUPPORT is not set$' "$CFG"; then
            perl -pi -e 's/^# CONFIG_RTL_CLIENT_MODE_SUPPORT is not set$/CONFIG_RTL_CLIENT_MODE_SUPPORT=y/' "$CFG"
          elif ! grep -q '^CONFIG_RTL_CLIENT_MODE_SUPPORT=y$' "$CFG"; then
            printf '\nCONFIG_RTL_CLIENT_MODE_SUPPORT=y\n' >> "$CFG"
          fi

          if grep -q '^# CONFIG_RTL_REPEATER_MODE_SUPPORT is not set$' "$CFG"; then
            perl -pi -e 's/^# CONFIG_RTL_REPEATER_MODE_SUPPORT is not set$/CONFIG_RTL_REPEATER_MODE_SUPPORT=y/' "$CFG"
          elif ! grep -q '^CONFIG_RTL_REPEATER_MODE_SUPPORT=y$' "$CFG"; then
            printf 'CONFIG_RTL_REPEATER_MODE_SUPPORT=y\n' >> "$CFG"
          fi

          # Hard fail here if our Makefile edits did not take effect.
          ! grep -q '^tools: promission_check' Makefile
          grep -q '^CONFIG_RTL8192CD=y$' "$CFG"
          grep -q '^CONFIG_RTL_VAP_SUPPORT=y$' "$CFG"
          grep -q '^CONFIG_RTL_CLIENT_MODE_SUPPORT=y$' "$CFG"
          grep -q '^CONFIG_RTL_REPEATER_MODE_SUPPORT=y$' "$CFG"
          grep -q '^TBS_KERNEL_VERSION=linux-2.6.30.9$' "$ROOT/customer/product/DSL2750U/arch.mk"

          echo '=== VERIFIED ==='
          grep -n '^tools:' Makefile
          grep -E '^CONFIG_RTL8192CD=|^CONFIG_RTL_CLIENT_MODE_SUPPORT=|^CONFIG_RTL_REPEATER_MODE_SUPPORT=|^CONFIG_RTL_VAP_SUPPORT=' "$CFG"
          grep '^TBS_KERNEL_VERSION=' "$ROOT/customer/product/DSL2750U/arch.mk"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/rsdk-1.5.6-5281-EB-2.6.30-0.9.30.3-110915/bin:$PATH"
          cd "$GITHUB_WORKSPACE/RTL8676xx"
          make autobuild AUTOPRODUCT=DSL2750U V=1

      - name: Verify firmware
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$GITHUB_WORKSPACE/RTL8676xx/build/romfs/image.img"
          test -f "$IMAGE"
          ls -lh "$IMAGE"
          file "$IMAGE"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: dsl2750u-universal-repeater
          path: RTL8676xx/build/romfs/image.img

