name: Build DSL2750U Repeater

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            g++-multilib \
            flex \
            bison \
            gperf \
            subversion \
            ncurses-dev \
            libncurses5-dev \
            libc6-dev-i386 \
            zlib1g-dev:i386

      - name: Prepare legacy Realtek SDK
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE"
          SDK="$ROOT/RTL8676xx"
          RSDK="$ROOT/rsdk-1.5.6-5281-EB-2.6.30-0.9.30.3-110915"

          cd "$SDK"

          # Legacy scripts are invoked by /bin/sh but use bash's "source".
          sed -i 's/^source /. /' tools/mkbuilddir
          sed -i 's/^source /. /' tools/prepareBLP.sh

          # The checkout is not an SVN working copy.
          sed -i 's/^[[:space:]]*SVNST=`svn st \$\$defconfig`;/\tSVNST=;/' Makefile

          # Old test syntax.
          sed -i 's/\[ -a \.config \]/[ -e .config ]/' Makefile

          # Do not run the obsolete SUID/mknod check.
          sed -i 's/^tools: promission_check$/tools:/' Makefile

          # The source archive ships these generated Kconfig files.
          cp -f scripts/lex.zconf.c_shipped scripts/lex.zconf.c
          cp -f scripts/zconf.tab.c_shipped scripts/zconf.tab.c
          cp -f scripts/zconf.hash.c_shipped scripts/zconf.hash.c

          # autobuild only needs scripts/conf, not interactive mconf.
          sed -i 's/^OBJS = conf mconf$/OBJS = conf/' scripts/Makefile

          # The vendor SDK expects this absolute toolchain path.
          sudo mkdir -p /opt/tbs_toolchains/realtek
          sudo ln -sfn "$RSDK" \
            /opt/tbs_toolchains/realtek/rsdk-1.5.6-5281-EB-2.6.30-0.9.30.3-110915

          export PATH="$RSDK/bin:$PATH"
          echo "$RSDK/bin" >> "$GITHUB_PATH"

          echo "=== TOOLCHAIN ==="
          test -x "$RSDK/bin/rsdk-linux-gcc"
          "$RSDK/bin/rsdk-linux-gcc" --version || true

          # The repository contains old prebuilt i386 host objects.
          # Build ALL vendor host tools as 32-bit, matching that environment.
          # Passing CC/HOSTCC on the command line propagates to recursive makes.
          sed -i \
            's#make -C tools/src install#make -C tools/src install CC="gcc -m32" HOSTCC="gcc -m32"#' \
            Makefile

          sed -i \
            's#make -C tools/src clean#make -C tools/src clean CC="gcc -m32" HOSTCC="gcc -m32"#' \
            Makefile

          # Remove all shipped/pre-existing host objects and binaries so nothing
          # 32-bit/64-bit gets mixed during the new build.
          make -C tools/src clean CC="gcc -m32" HOSTCC="gcc -m32" || true

          echo "=== REPEATER CONFIG ==="
          CFG="$ROOT/customer/product/DSL2750U/defconfig"

          grep -q '^CONFIG_RTL8192CD=y$' "$CFG"
          grep -q '^CONFIG_RTL_VAP_SUPPORT=y$' "$CFG"

          grep -q '^CONFIG_RTL_CLIENT_MODE_SUPPORT=y$' "$CFG" || \
            printf '\nCONFIG_RTL_CLIENT_MODE_SUPPORT=y\n' >> "$CFG"

          grep -q '^CONFIG_RTL_REPEATER_MODE_SUPPORT=y$' "$CFG" || \
            printf 'CONFIG_RTL_REPEATER_MODE_SUPPORT=y\n' >> "$CFG"

          grep -E \
            '^CONFIG_RTL8192CD=|^CONFIG_RTL_CLIENT_MODE_SUPPORT=|^CONFIG_RTL_REPEATER_MODE_SUPPORT=|^CONFIG_RTL_VAP_SUPPORT=' \
            "$CFG"

          echo "=== KERNEL ==="
          grep '^TBS_KERNEL_VERSION=' "$ROOT/customer/product/DSL2750U/arch.mk"

          echo "=== BUILD TARGET ==="
          grep -n 'tools/src install' Makefile

      - name: Build DSL2750U
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$GITHUB_WORKSPACE/rsdk-1.5.6-5281-EB-2.6.30-0.9.30.3-110915/bin:$PATH"

          cd "$GITHUB_WORKSPACE/RTL8676xx"

          make autobuild AUTOPRODUCT=DSL2750U V=1

      - name: Verify firmware
        shell: bash
        run: |
          set -euxo pipefail

          IMAGE="$GITHUB_WORKSPACE/RTL8676xx/build/romfs/image.img"

          test -f "$IMAGE"
          ls -lh "$IMAGE"
          file "$IMAGE"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: dsl2750u-universal-repeater
          path: RTL8676xx/build/romfs/image.img
