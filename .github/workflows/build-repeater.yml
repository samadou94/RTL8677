name: Build DSL2750U Repeater

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison gperf subversion ncurses-dev libncurses5-dev

      - name: Prepare legacy SDK
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          SDK="$ROOT/RTL8676xx"
          RSDK="$ROOT/rsdk-1.5.6-5281-EB-2.6.30-0.9.30.3-110915"

          cd "$SDK"

          # Normalize old CRLF files before modifying them.
          perl -pi -e 's/\r$//' Makefile tools/mkbuilddir tools/prepareBLP.sh scripts/Makefile

          # These legacy scripts use Bash "source" but are invoked by /bin/sh.
          perl -pi -e 's/^source /. /' tools/mkbuilddir tools/prepareBLP.sh

          # GitHub checkout is not an SVN working copy. The warning is harmless,
          # but remove the exact SVN status command used by ckconfig.
          perl -pi -e 's/SVNST=`svn st \$\$defconfig`;/SVNST=;/' Makefile

          # Fix the old /bin/sh test syntax.
          perl -pi -e 's/\[ -a \.config \]/[ -e .config ]/g' Makefile

          # Remove the obsolete SUID prerequisite from the tools target.
          # Replace the entire target declaration, regardless of whitespace.
          sed -i '/^[[:space:]]*tools:[[:space:]]*promission_check[[:space:]]*$/c\tools:' Makefile

          # Verify the exact Makefile that autobuild will use.
          echo '=== TOOLS TARGET ==='
          grep -n -A2 -B1 '^tools:' Makefile
          ! grep -Eq '^[[:space:]]*tools:[[:space:]]+promission_check[[:space:]]*$' Makefile

          # The legacy SquashFS 4.1 source collides with modern glibc's major()/minor()
          # macros. Rename only the local variables first; then add sysmacros so makedev()
          # is declared. The line ranges match the unmodified source in this archive.
          SQFS="tools/src/sqlzma/squashfs4.1/squashfs-tools/mksquashfs.c"
          perl -pi -e 'if ($. >= 1356 && $. <= 1374) { s/\bmajor\b(?!\s*\()/major_num/g; s/\bminor\b(?!\s*\()/minor_num/g }' "$SQFS"
          perl -pi -e 'if ($. >= 1380 && $. <= 1398) { s/\bmajor\b(?!\s*\()/major_num/g; s/\bminor\b(?!\s*\()/minor_num/g }' "$SQFS"
          if ! grep -q '^#include <sys/sysmacros.h>$' "$SQFS"; then
            perl -0pi -e 's/(#include <sys\/types\.h>\r?\n)/$1#include <sys\/sysmacros.h>\n/' "$SQFS"
          fi
          rm -f "${SQFS%.c}.o"

          # autobuild needs scripts/conf, not interactive mconf.
          perl -pi -e 's/^OBJS = conf mconf$/OBJS = conf/' scripts/Makefile

          # The archive contains prebuilt 32-bit host objects. Delete those
          # objects/binaries so the Ubuntu runner rebuilds host tools natively.
          find tools/src -type f \
            \( -name '*.o' \
            -o -name 'mkimage_ex' \
            -o -name 'mkimage' \
            -o -name 'mksquashfs' \
            -o -name 'lzma' \
            -o -name 'formatcsv' \
            -o -name 'sstrip' \
            -o -name 'mktree' \
            -o -name 'xmltool' \
            -o -name 'xml_flash_tool' \) \
            -delete

          # The Kconfig parser sources are shipped in the archive.
          cp -f scripts/lex.zconf.c_shipped scripts/lex.zconf.c
          cp -f scripts/zconf.tab.c_shipped scripts/zconf.tab.c
          cp -f scripts/zconf.hash.c_shipped scripts/zconf.hash.c

          # The SDK expects this exact bundled toolchain path.
          sudo mkdir -p /opt/tbs_toolchains/realtek
          sudo ln -sfn "$RSDK" \
            /opt/tbs_toolchains/realtek/rsdk-1.5.6-5281-EB-2.6.30-0.9.30.3-110915

          export PATH="$RSDK/bin:$PATH"
          echo "$RSDK/bin" >> "$GITHUB_PATH"

          # Enable the existing RTL8192CD client + Universal Repeater code.
          CFG="$ROOT/customer/product/DSL2750U/defconfig"
