name: Build DSL2750U Repeater

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison gperf ncurses-dev subversion

      - name: Prepare legacy SDK
        shell: bash
        run: |
          set -eux

          SDK="$GITHUB_WORKSPACE/RTL8676xx"
          RSDK="$GITHUB_WORKSPACE/rsdk-1.5.6-5281-EB-2.6.30-0.9.30.3-110915"
          cd "$SDK"

          # The SDK expects the toolchain at this hard-coded location.
          sudo mkdir -p /opt/tbs_toolchains/realtek
          sudo ln -sfn "$RSDK" \
            /opt/tbs_toolchains/realtek/rsdk-1.5.6-5281-EB-2.6.30-0.9.30.3-110915

          echo "$RSDK/bin" >> "$GITHUB_PATH"

          # Git checkout is not an SVN working copy. Keep the old checks harmless.
          sed -i 's/\[ -a \.config \]/[ -e .config ]/' Makefile
          sed -i 's/SVNST=`svn st \$\$defconfig`;/SVNST=;/' Makefile

          # The generated kconfig parser files are shipped in the source archive.
          cp -f scripts/lex.zconf.c_shipped  scripts/lex.zconf.c
          cp -f scripts/zconf.tab.c_shipped  scripts/zconf.tab.c
          cp -f scripts/zconf.hash.c_shipped scripts/zconf.hash.c

          # autobuild does not need interactive menuconfig.
          # Avoid the legacy mconf/ncurses linker problem.
          sed -i 's/^OBJS = conf mconf$/OBJS = conf/' scripts/Makefile

          # Enable the two RTL8192CD features needed for Universal Repeater.
          CFG="$GITHUB_WORKSPACE/customer/product/DSL2750U/defconfig"
          sed -i \
            's/^# CONFIG_RTL_CLIENT_MODE_SUPPORT is not set$/CONFIG_RTL_CLIENT_MODE_SUPPORT=y/' \
            "$CFG"
          sed -i \
            's/^# CONFIG_RTL_REPEATER_MODE_SUPPORT is not set$/CONFIG_RTL_REPEATER_MODE_SUPPORT=y/' \
            "$CFG"

          echo "=== CONFIG ==="
          grep -E \
            'CONFIG_RTL8192CD=|CONFIG_RTL_CLIENT_MODE_SUPPORT=|CONFIG_RTL_REPEATER_MODE_SUPPORT=|CONFIG_RTL_VAP_SUPPORT=' \
            "$CFG"

          echo "=== TOOLCHAIN ==="
          ls -l "$RSDK/bin/rsdk-linux-gcc"
          "$RSDK/bin/rsdk-linux-gcc" --version || true

      - name: Build
        shell: bash
        run: |
          set -eux
          export PATH="$GITHUB_WORKSPACE/rsdk-1.5.6-5281-EB-2.6.30-0.9.30.3-110915/bin:$PATH"
          cd "$GITHUB_WORKSPACE/RTL8676xx"
          make autobuild AUTOPRODUCT=DSL2750U V=1

      - name: Verify output
        shell: bash
        run: |
          set -eux
          find "$GITHUB_WORKSPACE/RTL8676xx/build" -maxdepth 5 -type f \
            \( -name image.img -o -name image.bin \) -print
          test -f "$GITHUB_WORKSPACE/RTL8676xx/build/romfs/image.img"
          ls -lh "$GITHUB_WORKSPACE/RTL8676xx/build/romfs/image.img"
          file "$GITHUB_WORKSPACE/RTL8676xx/build/romfs/image.img"

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: dsl2750u-repeater-build
          path: RTL8676xx/build/romfs/image.img
