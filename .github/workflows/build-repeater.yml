name: Build DSL2750U Repeater

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            flex \
            bison \
            gperf \
            ncurses-dev \
            libncurses5-dev \
            libc6-i386 \
            libgcc-s1:i386 \
            zlib1g:i386

      - name: Prepare legacy Realtek SDK
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          SDK="$ROOT/RTL8676xx"
          RSDK="$ROOT/rsdk-1.5.6-5281-EB-2.6.30-0.9.30.3-110915"

          cd "$SDK"

          # Normalize legacy CRLF Makefiles before editing them.
          sed -i 's/\r$//' Makefile
          sed -i 's/\r$//' tools/mkbuilddir
          sed -i 's/\r$//' tools/prepareBLP.sh
          sed -i 's/\r$//' scripts/Makefile

          # Legacy scripts are invoked with /bin/sh but use bash's "source".
          sed -i 's/^source /. /' tools/mkbuilddir
          sed -i 's/^source /. /' tools/prepareBLP.sh

          # GitHub checkout is not an SVN working copy.
          sed -i 's/^[[:space:]]*SVNST=`svn st \$\$defconfig`;/\tSVNST=;/' Makefile

          # autobuild does not need the obsolete SUID/mknod permission check.
          # Remove it from the "tools" prerequisite instead of modifying
          # the check recipe itself.
          grep -q '^tools: promission_check$' Makefile
          sed -i 's/^tools: promission_check$/tools:/' Makefile

          # Kconfig parser sources are shipped in the archive.
          cp -f scripts/lex.zconf.c_shipped scripts/lex.zconf.c
          cp -f scripts/zconf.tab.c_shipped scripts/zconf.tab.c
          cp -f scripts/zconf.hash.c_shipped scripts/zconf.hash.c

          # autobuild only needs scripts/conf, not interactive mconf.
          sed -i 's/^OBJS = conf mconf$/OBJS = conf/' scripts/Makefile

          # The SDK hardcodes this toolchain location in arch.mk.
          sudo mkdir -p /opt/tbs_toolchains/realtek
          sudo ln -sfn "$RSDK" \
            /opt/tbs_toolchains/realtek/rsdk-1.5.6-5281-EB-2.6.30-0.9.30.3-110915

          export PATH="$RSDK/bin:$PATH"
          echo "$RSDK/bin" >> "$GITHUB_PATH"

          # Enable RTL8192CD client + Universal Repeater.
          CFG="$ROOT/customer/product/DSL2750U/defconfig"

          grep -q '^CONFIG_RTL8192CD=y$' "$CFG"
          grep -q '^CONFIG_RTL_VAP_SUPPORT=y$' "$CFG"

          grep -q '^CONFIG_RTL_CLIENT_MODE_SUPPORT=y$' "$CFG" || \
            printf '\nCONFIG_RTL_CLIENT_MODE_SUPPORT=y\n' >> "$CFG"

          grep -q '^CONFIG_RTL_REPEATER_MODE_SUPPORT=y$' "$CFG" || \
            printf 'CONFIG_RTL_REPEATER_MODE_SUPPORT=y\n' >> "$CFG"

          echo '=== FINAL DEFCONFIG ==='
          grep -E '^CONFIG_RTL8192CD=|^CONFIG_RTL_CLIENT_MODE_SUPPORT=|^CONFIG_RTL_REPEATER_MODE_SUPPORT=|^CONFIG_RTL_VAP_SUPPORT=' "$CFG"

          echo '=== KERNEL VERSION ==='
          grep '^TBS_KERNEL_VERSION=' "$ROOT/customer/product/DSL2750U/arch.mk"

          echo '=== TOOLCHAIN ==='
          test -x "$RSDK/bin/rsdk-linux-gcc"
          ls -l "$RSDK/bin/rsdk-linux-gcc"
          file "$RSDK/bin/rsdk-linux-gcc"

          echo '=== MAKEFILE CHECK ==='
          grep -n '^tools:' Makefile
          grep -n '^promission_check:' Makefile

      - name: Build DSL2750U
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$GITHUB_WORKSPACE/rsdk-1.5.6-5281-EB-2.6.30-0.9.30.3-110915/bin:$PATH"

          cd "$GITHUB_WORKSPACE/RTL8676xx"

          make autobuild AUTOPRODUCT=DSL2750U V=1

      - name: Verify firmware
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$GITHUB_WORKSPACE/RTL8676xx/build/romfs/image.img"

          test -f "$IMAGE"
          ls -lh "$IMAGE"
          file "$IMAGE"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: dsl2750u-universal-repeater
          path: RTL8676xx/build/romfs/image.img
