name: Build DSL-2750U Repeater

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            subversion \
            libncurses5-dev \
            libncurses-dev \
            libc6-i386 \
            zlib1g:i386

      - name: Prepare legacy RSDK
        shell: bash
        run: |
          RSDK="$GITHUB_WORKSPACE/rsdk-1.5.6-5281-EB-2.6.30-0.9.30.3-110915"
          RSDKDST="/opt/tbs_toolchains/realtek/$(basename "$RSDK")"

          sudo mkdir -p /opt/tbs_toolchains/realtek
          sudo ln -sfn "$RSDK" "$RSDKDST"

          chmod -R a+rx "$RSDK/bin" "$RSDK/lib" "$RSDK/libexec"

          echo "$RSDK/bin" >> "$GITHUB_PATH"

          file "$RSDK/bin/rsdk-linux-gcc"
          "$RSDK/bin/rsdk-linux-gcc" --version

      - name: Enable RTL8192CD client + Universal Repeater
        shell: bash
        run: |
          CFG="customer/product/DSL2750U/defconfig"

          sed -i \
            's/^# CONFIG_RTL_CLIENT_MODE_SUPPORT is not set/CONFIG_RTL_CLIENT_MODE_SUPPORT=y/' \
            "$CFG"

          sed -i \
            's/^# CONFIG_RTL_REPEATER_MODE_SUPPORT is not set/CONFIG_RTL_REPEATER_MODE_SUPPORT=y/' \
            "$CFG"

          grep -E 'CONFIG_RTL8192CD=|CONFIG_RTL_CLIENT_MODE_SUPPORT=|CONFIG_RTL_REPEATER_MODE_SUPPORT=|CONFIG_RTL_VAP_SUPPORT=' "$CFG"

      - name: Build
        shell: bash
        run: |
          cd RTL8676xx
          make autobuild AUTOPRODUCT=DSL2750U V=1

      - name: Verify image
        shell: bash
        run: |
          test -f RTL8676xx/build/romfs/image.img
          ls -lh RTL8676xx/build/romfs/image.img
          file RTL8676xx/build/romfs/image.img

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsl2750u-repeater-build
          path: |
            RTL8676xx/build/romfs/image.img
            RTL8676xx/build/romfs/image.bin
          if-no-files-found: warn
