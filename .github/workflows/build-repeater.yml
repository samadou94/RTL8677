name: Build RTL8677 repeater firmware

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            flex \
            bison \
            gperf \
            subversion \
            ncurses-dev \
            libncurses5-dev \
            libattr1-dev \
            autoconf \
            automake \
            libtool \
            m4

          # The vendor SDK assumes /bin/sh is bash (brace expansion like
          # lib{ssl,crypto}.so*, [[ ]], "function", "source"). Ubuntu's /bin/sh is
          # dash, which breaks all of those. Point sh at bash on this runner.
          sudo ln -sf /bin/bash /bin/sh
          ls -l /bin/sh

      - name: Prepare legacy SDK
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          SDK="$ROOT/RTL8676xx"
          RSDK="$ROOT/rsdk-1.5.6-5281-EB-2.6.30-0.9.30.3-110915"

          cd "$SDK"

          # Normalize legacy files.
          perl -pi -e 's/\r$//' \
            Makefile tools/mkbuilddir tools/prepareBLP.sh scripts/Makefile

          # Fix Bash-only syntax in scripts that get run by /bin/sh (dash).
          perl -pi -e 's/^source /. /' \
            tools/mkbuilddir tools/prepareBLP.sh
          # "function foo" -> "foo()"  (fixes: mkbuilddir: 9: function: not found)
          perl -pi -e 's/^(\s*)function\s+(\w+)\s*(?:\(\s*\))?/$1$2()/' \
            tools/mkbuilddir tools/prepareBLP.sh
          # Also make the shebang bash in case they are executed directly.
          sed -i '1s|^#!.*|#!/bin/bash|' tools/mkbuilddir tools/prepareBLP.sh

          # Skip SVN status command: GitHub checkout is not an SVN working copy.
          perl -pi -e 's/SVNST=`svn st \$\$defconfig`;/SVNST=;/' Makefile

          # Fix legacy shell test syntax.
          perl -pi -e 's/\[ -a \.config \]/[ -e .config ]/g' Makefile

          # Neutralize the obsolete SUID permission check.
          sed -i '/^promission_check:$/,/^tools:/{/^promission_check:$/!{/^tools:/!d}}' Makefile
          sed -i '/^promission_check:$/c\promission_check: ; @echo "Skipping legacy SUID permission check"' Makefile
          sed -i '/^[[:space:]]*tools:[[:space:]]*promission_check[[:space:]]*$/c\tools:' Makefile

          # Fix SquashFS 4.1 for modern glibc / GCC.
          SQFS="tools/src/sqlzma/squashfs4.1/squashfs-tools/mksquashfs.c"
          SQFS_MK="tools/src/sqlzma/squashfs4.1/squashfs-tools/Makefile"
          test -f "$SQFS"

          perl -pi -e 'if ($. >= 1356 && $. <= 1374) { s/\bmajor\b(?!\s*\()/major_num/g; s/\bminor\b(?!\s*\()/minor_num/g }' "$SQFS"
          perl -pi -e 'if ($. >= 1380 && $. <= 1398) { s/\bmajor\b(?!\s*\()/major_num/g; s/\bminor\b(?!\s*\()/minor_num/g }' "$SQFS"

          if ! grep -q '^#include <sys/sysmacros.h>$' "$SQFS"; then
            perl -0pi -e 's/(#include <sys\/types\.h>\r?\n)/$1#include <sys\/sysmacros.h>\n/' "$SQFS"
          fi

          # GCC >= 5 uses C99/C11 inline rules: a non-static "inline" function
          # emits no symbol -> "undefined reference to `add_dir_entry'".
          # 1) make add_dir_entry a normal function
          perl -pi -e 's/^(?:static\s+)?inline\s+(void\s+add_dir_entry\b)/$1/' "$SQFS"
          # 2) build the tool with old GNU inline semantics, and pull in
          #    sys/sysmacros.h for every file (glibc >= 2.28 moved
          #    major/minor/makedev there -> "undefined reference to `makedev'").
          if ! grep -q 'fgnu89-inline' "$SQFS_MK"; then
            sed -i 's|-O2|-O2 -fgnu89-inline -include sys/sysmacros.h|' "$SQFS_MK"
          fi

          # Host expat (used by xmltool) is configured while the vendor
          # cross-toolchain env (AR/RANLIB/LD/NM/STRIP=rsdk-linux-*) is active,
          # so libexpat.a gets no index -> "archive has no index; run ranlib".
          # Force native binutils for that configure run.
          XMLMK="tools/src/mkxml/Makefile"
          test -f "$XMLMK"
          perl -pi -e 's{(?<![\w=])(\./configure\b)}{AR=ar RANLIB=ranlib LD=ld NM=nm STRIP=strip CC=gcc $1}' "$XMLMK"
          rm -rf tools/src/mkxml/xmlparser
          grep -q 'RANLIB=ranlib' "$XMLMK"

          # Linux 2.6.30 kernel/timeconst.pl uses defined(@array), which is a
          # fatal error in Perl >= 5.22 ("Can't use 'defined(@array)'").
          # Patch the real source file (the build tree only symlinks to it).
          TC="src/kernel/linux-2.6.30.9/kernel/timeconst.pl"
          test -f "$TC"
          perl -pi -e 's/defined\s*\(\s*(\@\w+)\s*\)/$1/g; s/defined\s+(\@\w+)/$1/g' "$TC"
          if grep -nE 'defined\s*\(?\s*@' "$TC"; then echo "timeconst.pl patch failed"; exit 1; fi

          # GNU make >= 4.3 made "mixed implicit and normal rules" (e.g.
          # "config %config:") a fatal error; busybox-1.6.1 and other legacy
          # kbuild-style Makefiles use it ("No rule to make target 'oldconfig'").
          # Split such rules into two rules with the same prerequisites/recipe.
          cat > /tmp/fix_mixed_rules.py <<'PYEOF'
          import re, sys
          p = sys.argv[1]
          lines = open(p, encoding='latin-1').read().split('\n')
          out, i, n = [], 0, 0
          hdr = re.compile(r'^([^\s#=:\t$][^:#=\t$]*?)\s*:(?![=:])(.*)$')
          while i < len(lines):
              l = lines[i]
              m = hdr.match(l)
              if m:
                  tg = m.group(1).split()
                  pats = [t for t in tg if '%' in t]
                  plain = [t for t in tg if '%' not in t]
                  if pats and plain:
                      head = [m.group(2)]
                      j = i + 1
                      while head[-1].rstrip().endswith('\\') and j < len(lines):
                          head.append(lines[j]); j += 1
                      rec = []
                      while j < len(lines) and (lines[j].startswith('\t') or
                            (lines[j].strip() == '' and j + 1 < len(lines) and lines[j + 1].startswith('\t'))):
                          rec.append(lines[j]); j += 1
                      for group in (plain, pats):
                          out.append(' '.join(group) + ':' + head[0])
                          out.extend(head[1:])
                          out.extend(rec)
                      n += 1
                      i = j
                      continue
              out.append(l)
              i += 1
          open(p, 'w', encoding='latin-1', newline='').write('\n'.join(out))
          print('%s: split %d mixed rule(s)' % (p, n))
          PYEOF
          find "$SDK/src" -type f \( -name Makefile -o -name 'Makefile.*' -o -name '*.mk' \) \
            \( -path '*/opensource/*' -o -path '*busybox*' \) \
            -exec python3 /tmp/fix_mixed_rules.py {} \; | grep -v ' split 0 ' || true

          # iptables-1.4.6: "/bin/sh: ./configure: not found" means the script is
          # missing, or has CRLF line endings (bad "#!/bin/sh\r" interpreter).
          IPT="src/opensource/iptables/iptables-1.4.6"
          test -d "$IPT"
          echo "--- iptables source dir before fix ---"
          ls -la "$IPT" | head -40
          # strip CRs from all text files, then restore executable bits
          grep -rIl $'\r' "$IPT" 2>/dev/null | xargs -r sed -i 's/\r$//' || true
          for f in configure config.sub config.guess install-sh missing depcomp ltmain.sh compile autogen.sh; do
            [ -f "$IPT/$f" ] && chmod +x "$IPT/$f" || true
          done
          # if configure was never committed, regenerate it
          if [ ! -f "$IPT/configure" ]; then
            echo "configure missing -> running autoreconf"
            test -f "$IPT/configure.ac" -o -f "$IPT/configure.in"
            (cd "$IPT" && autoreconf -fi)
          fi
          test -x "$IPT/configure" || chmod +x "$IPT/configure"
          head -1 "$IPT/configure"
          test -f "$IPT/configure"

          # pppd (ppp-2.4.3) links without -lcrypt on this runner ("undefined
          # reference to crypt/encrypt/setkey"): its Makefile only adds -lcrypt
          # when a host-side check passes (an existing "LIBS += -lcrypt" sits inside
          # that failing conditional). Append an unconditional one at the very end.
          PPPD="src/opensource/ppp-pppoe/ppp-2.4.3/pppd"
          test -d "$PPPD"
          for mk in "$PPPD/Makefile.linux" "$PPPD/Makefile"; do
            if [ -f "$mk" ] && ! grep -q 'added by CI: pppd needs libcrypt' "$mk"; then
              printf '\n# added by CI: pppd needs libcrypt (crypt/encrypt/setkey)\nLIBS += -lcrypt\n' >> "$mk"
              echo "patched $mk"
            fi
          done
          grep -q 'added by CI: pppd needs libcrypt' "$PPPD/Makefile.linux"
          grep -n -B3 -A3 'lcrypt' "$PPPD/Makefile.linux" | head -40
          echo "--- libcrypt in vendor toolchain ---"
          find "$RSDK" -name 'libcrypt*' 2>/dev/null | head || true

          # qrencode's configure needs libpng12 via pkg-config, but libpng is
          # installed into build/tmpdist (a cross prefix) and the Makefile never
          # sets PKG_CONFIG_PATH (the vendor's own host had it set globally).
          QRMK="src/opensource/qrencode/Makefile"
          test -f "$QRMK"
          perl -pi -e 's{(?<![\w=])(\./configure\b)}{PKG_CONFIG_PATH='"$SDK"'/build/tmpdist/lib/pkgconfig $1} if !/PKG_CONFIG_PATH=/' "$QRMK"
          grep -n 'PKG_CONFIG_PATH' "$QRMK"
          grep -q 'PKG_CONFIG_PATH=' "$QRMK"

          # Ensure the host tools are rebuilt for this runner.
          rm -f "${SQFS%.c}.o"
          perl -pi -e 's/^OBJS = conf mconf$/OBJS = conf/' scripts/Makefile

          find tools/src -type f \
            \( -name '*.o' \
            -o -name 'mkimage_ex' \
            -o -name 'mkimage' \
            -o -name 'mksquashfs' \
            -o -name 'lzma' \
            -o -name 'formatcsv' \
            -o -name 'sstrip' \
            -o -name 'mktree' \
            -o -name 'xmltool' \
            -o -name 'xml_flash_tool' \) \
            -delete

          # Restore shipped Kconfig parser sources.
          cp -f scripts/lex.zconf.c_shipped scripts/lex.zconf.c
          cp -f scripts/zconf.tab.c_shipped scripts/zconf.tab.c
          cp -f scripts/zconf.hash.c_shipped scripts/zconf.hash.c

          # Set up the vendor toolchain path.
          test -d "$RSDK/bin"
          sudo mkdir -p /opt/tbs_toolchains/realtek
          sudo ln -sfn "$RSDK" \
            /opt/tbs_toolchains/realtek/rsdk-1.5.6-5281-EB-2.6.30-0.9.30.3-110915

          export PATH="$RSDK/bin:$PATH"
          echo "$RSDK/bin" >> "$GITHUB_PATH"

          # Enable RTL8192CD client and repeater support.
          CFG="$ROOT/customer/product/DSL2750U/defconfig"
          test -f "$CFG"

          for option in CONFIG_RTL_CLIENT_MODE_SUPPORT CONFIG_RTL_REPEATER_MODE_SUPPORT; do
            if grep -q "^# $option is not set$" "$CFG"; then
              sed -i "s/^# $option is not set$/$option=y/" "$CFG"
            elif ! grep -q "^$option=y$" "$CFG"; then
              printf '\n%s=y\n' "$option" >> "$CFG"
            fi
          done

          # Validate the expected configuration and patches.
          grep -Eq '^tools:[[:space:]]*$' Makefile
          grep -q 'unsigned int major_num = major(buf->st_rdev);' "$SQFS"
          grep -q 'unsigned int minor_num = minor(buf->st_rdev);' "$SQFS"
          ! grep -q 'unsigned int major = major(buf->st_rdev);' "$SQFS"
          ! grep -q 'unsigned int minor = minor(buf->st_rdev);' "$SQFS"
          grep -q '#include <sys/sysmacros.h>' "$SQFS"
          ! grep -Eq '^\s*(static\s+)?inline\s+void\s+add_dir_entry' "$SQFS"

          grep -q '^CONFIG_RTL8192CD=y$' "$CFG"
          grep -q '^CONFIG_RTL_VAP_SUPPORT=y$' "$CFG"
          grep -q '^CONFIG_RTL_CLIENT_MODE_SUPPORT=y$' "$CFG"
          grep -q '^CONFIG_RTL_REPEATER_MODE_SUPPORT=y$' "$CFG"
          grep -q '^TBS_KERNEL_VERSION=linux-2.6.30.9$' \
            "$ROOT/customer/product/DSL2750U/arch.mk"

          echo "=== VERIFIED PREPARATION ==="
          grep -n '^promission_check:' Makefile
          grep -n '^tools:' Makefile
          grep -n 'add_dir_entry' "$SQFS" | head -3
          grep -n 'sysmacros' "$SQFS_MK" || true
          grep -n 'RANLIB=ranlib' "$XMLMK"

      - name: Build
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          SDK="$ROOT/RTL8676xx"
          RSDK="$ROOT/rsdk-1.5.6-5281-EB-2.6.30-0.9.30.3-110915"

          export PATH="$RSDK/bin:$PATH"

          # qrencode's configure runs pkg-config for the cross-compiled libpng12.
          # libpng12 is built earlier in this same Build step and installs its
          # libpng12.pc into build/tmpdist/lib/pkgconfig. Export PKG_CONFIG_PATH
          # for the entire step so qrencode can find it when its configure runs.
          export PKG_CONFIG_PATH="$SDK/build/tmpdist/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"

          cd "$SDK"

          # Generate the product configuration.
          make autoprepare AUTOPRODUCT=DSL2750U V=1

          # libusb-0.1.12 was generated on the original vendor build host and
          # its generated Makefile contains an absolute path to that host's
          # "missing" helper:
          #   /mnt/sda1/.../libusb-0.1.12/missing
          # The helper is not present in this Git checkout, so GNU make tries
          # to execute a path that cannot exist on GitHub Actions.
          #
          # The release tree already contains the generated Autotools metadata.
          # Keep it and prevent the obsolete aclocal refresh from running.
          LIBUSB_ROOT="$SDK/build.DSL2750U/apps/logic/new3g/3g-mngr/usb/libusb-0.1.12"
          test -d "$LIBUSB_ROOT"
          test -f "$LIBUSB_ROOT/Makefile"
          test -f "$LIBUSB_ROOT/aclocal.m4"

          # The vendor checkout contains an incomplete/broken libusb-0.1.12
          # source tree: the generated build copy can contain only Autotools
          # metadata (or broken symlinks), so config.status --recheck fails with
          # "cannot find sources (usb.c)".  Restore the actual libusb 0.1.12
          # C/header sources without replacing the vendor-generated Makefile or
          # configure metadata used by this SDK.
          LIBUSB_TMP=$(mktemp -d)
          trap 'rm -rf "$LIBUSB_TMP"' EXIT
          curl -L --fail --retry 3 --retry-delay 2 \
            -o "$LIBUSB_TMP/libusb-0.1.12.tar.gz" \
            https://downloads.sourceforge.net/libusb/libusb-0.1.12.tar.gz
          tar -xzf "$LIBUSB_TMP/libusb-0.1.12.tar.gz" -C "$LIBUSB_TMP"
          LIBUSB_SRC="$LIBUSB_TMP/libusb-0.1.12"
          test -f "$LIBUSB_SRC/usb.c"
          test -f "$LIBUSB_SRC/linux.c"
          test -f "$LIBUSB_SRC/error.c"
          test -f "$LIBUSB_SRC/descriptors.c"

          # Remove broken source/header symlinks from the generated build tree
          # before copying real files into it.
          find "$LIBUSB_ROOT" -maxdepth 1 -type l \
            \( -name '*.c' -o -name '*.h' \) ! -exec test -e {} \; \
            -delete
          find "$LIBUSB_SRC" -maxdepth 1 -type f \
            \( -name '*.c' -o -name '*.h' \) \
            -exec cp -f {} "$LIBUSB_ROOT/" \;

          test -f "$LIBUSB_ROOT/usb.c"
          test -f "$LIBUSB_ROOT/linux.c"
          test -f "$LIBUSB_ROOT/error.c"
          test -f "$LIBUSB_ROOT/descriptors.c"

          # The libusb tree was generated on the original vendor build host.
          # Its Makefile.in/configure files contain absolute references to the
          # vendor's "missing" helper, e.g.
          #   /home/dslpl3/tangqiang/.../libusb-0.1.12/missing --run autoconf
          # Patching only Makefile is insufficient: ./configure recreates it from
          # Makefile.in before the build continues. Replace the stale helper in
          # every text file in the libusb tree so both configure and make stay local.
          echo "=== PATCHING STALE LIBUSB AUTOTOOLS PATHS ==="
          python3 - "$LIBUSB_ROOT" <<'PYLIBUSB'
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          # Match any absolute path ending in /missing when it is immediately
          # followed by the Automake/Autoconf helper invocation "--run".
          pattern = re.compile(r"/[^\s\"'`]+/missing(?=\s+--run)")

          patched = 0
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              try:
                  data = path.read_text(encoding="latin-1")
              except (OSError, UnicodeError):
                  continue
              new_data, count = pattern.subn("/bin/true", data)
              if count:
                  path.write_text(new_data, encoding="latin-1", newline="")
                  print(f"patched {path}: {count} stale helper reference(s)")
                  patched += count

          print(f"total stale libusb helper references patched: {patched}")
          PYLIBUSB

          # Patching only Makefile is insufficient: ./configure can recreate it
          # from Makefile.in before the build continues. Ensure no stale helper
          # invocation remains anywhere in the libusb source/build metadata.
          if grep -RIlq 'missing --run' "$LIBUSB_ROOT"; then
            echo "stale libusb missing helper reference remains"
            grep -RIn 'missing --run' "$LIBUSB_ROOT" | head -40
            exit 1
          fi

          # Keep the generated Autotools metadata self-consistent.
          # Touch aclocal.m4 first and Makefile.in last so Make does not consider
          # Makefile.in older than aclocal.m4.
          touch "$LIBUSB_ROOT/aclocal.m4"
          touch "$LIBUSB_ROOT/Makefile.in"

          # Remove stale vendor-host Autotools command variables as another
          # safeguard against accidental regeneration.
          sed -i -E \
            -e 's#^ACLOCAL[[:space:]]*=.*$#ACLOCAL = :#' \
            -e 's#^AUTOMAKE[[:space:]]*=.*$#AUTOMAKE = :#' \
            -e 's#^AUTOCONF[[:space:]]*=.*$#AUTOCONF = :#' \
            -e 's#^AUTOHEADER[[:space:]]*=.*$#AUTOHEADER = :#' \
            "$LIBUSB_ROOT/Makefile"

          echo "=== LIBUSB AUTOTOOLS CHECK ==="
          grep -nE 'missing --run|^(ACLOCAL|AUTOMAKE|AUTOCONF|AUTOHEADER)[[:space:]]*=' \
            "$LIBUSB_ROOT/Makefile" || true
          stat "$LIBUSB_ROOT/aclocal.m4" "$LIBUSB_ROOT/Makefile.in"
          test "$LIBUSB_ROOT/Makefile.in" -nt "$LIBUSB_ROOT/aclocal.m4"

          # Re-run the mixed-rule fix on any copies created under the build tree.
          find "$SDK"/build.DSL2750U/opensource -type f \( -name Makefile -o -name 'Makefile.*' -o -name '*.mk' \) \
            -exec python3 /tmp/fix_mixed_rules.py {} \; 2>/dev/null | grep -v ' split 0 ' || true

          # autoprepare may regenerate the Makefile; patch it again.
          sed -i '/^promission_check:$/,/^tools:/{/^promission_check:$/!{/^tools:/!d}}' Makefile
          sed -i '/^promission_check:$/c\promission_check: ; @echo "Skipping legacy SUID permission check"' Makefile
          sed -i '/^[[:space:]]*tools:[[:space:]]*promission_check[[:space:]]*$/c\tools:' Makefile

          echo "=== POST-AUTOPREPARE TARGET CHECK ==="
          sed -n '/^promission_check:/,/^tools:/p' Makefile
          grep -Eq '^tools:[[:space:]]*$' Makefile

          # adslstart calls app_item_get(), but the generated Makefile in this
          # legacy SDK has no explicit link rule. GNU make therefore falls back
          # to its built-in C rule:
          #   rsdk-linux-gcc adslstart.o -o adslstart
          # and the link fails with undefined reference to app_item_get.
          #
          # SSAP was already built successfully at build/apps/ssap/lib, and the
          # vendor's other SSAP applications link against libssap.so plus the
          # tmpdist libraries. Add an explicit adslstart rule with those same
          # libraries and with the actual absolute build paths.
          ADSLSTART_DIR="$SDK/build.DSL2750U/vendor/realtek/adslstart"
          ADSLSTART_MK="$ADSLSTART_DIR/Makefile"
          test -f "$ADSLSTART_MK"
          test -f "$SDK/build/apps/ssap/lib/libssap.so"
          test -f "$SDK/build/tmpdist/lib/libscew.a" -o \
            -f "$SDK/build/tmpdist/lib/libscew.so"

          if ! grep -q 'CI fix: explicit SSAP link for adslstart' "$ADSLSTART_MK"; then
            cat >> "$ADSLSTART_MK" <<'EOF'
          
          # CI fix: explicit SSAP link for adslstart
          ADSLSTART_LIBS = -lutil -lssap -L__SDK_BUILD__/apps/ssap/lib -L__SDK_BUILD__/tmpdist/lib -lscew -lexpat -lz
          
          adslstart: adslstart.o
          	@echo "CI: linking adslstart with libssap"
          	rsdk-linux-gcc adslstart.o -o adslstart $(ADSLSTART_LIBS)
          EOF
          fi

          # Substitute the workspace-specific SDK path into the rule without
          # relying on any vendor Makefile variables that may not be defined in
          # this subdirectory.
          sed -i "s#__SDK_BUILD__#$SDK/build#g" "$ADSLSTART_MK"

          echo "=== ADSLSTART LINK CHECK ==="
          grep -n -A6 'CI fix: explicit SSAP link for adslstart' "$ADSLSTART_MK"

          # Compile host tools, kernel subdirectories, and firmware filesystems.
          # Compile host tools, kernel subdirectories, and firmware filesystems.
          make tools V=1

          if ! make subdirs rootfs romfs V=1; then
            echo "::group::Diagnostics after failed kernel/rootfs build"
            KDIR="$(readlink -f build.DSL2750U/kernel/linux-2.6.30.9)"
            KBSP="$KDIR/arch/rlx/bsp"
            echo "KDIR=$KDIR"
            ls -la "$KBSP" || true
            echo "--- bsp Makefile (adsl lines) ---"
            grep -n -i 'adsl' "$KBSP/Makefile" || true
            echo "--- every adsl file in the checkout ---"
            find "$ROOT" -iname '*adsl*' -not -path '*/.git/*' 2>/dev/null | head -40 || true
            echo "::endgroup::"

            # "No rule to make target arch/rlx/bsp/adsl.o": the BSP Makefile
            # builds adsl.o but no adsl source/object exists in the repo (a
            # vendor ADSL file that was never committed). This repeater build
            # does not use ADSL, so build an empty adsl.o and continue.
            if [ -f "$KBSP/Makefile" ] \
               && grep -q 'adsl\.o' "$KBSP/Makefile" \
               && [ ! -e "$KBSP/adsl.c" ] && [ ! -e "$KBSP/adsl.S" ] \
               && [ ! -e "$KBSP/adsl.o" ] && [ ! -e "$KBSP/adsl.o_shipped" ]; then
              echo "adsl source missing -> creating stub adsl.c"
              # The vendor ADSL blob (adsl.o) also provides a few symbols that the
              # SAR/ATM driver and EOC code reference at the final vmlinux link
              # (mm_sendEOCmessage, mm_getEOCrxmessage, sendToPort0,
              # EnterHeavyTraffic, ExitHeavyTraffic). Provide no-op versions so the
              # kernel links; DSL line support is therefore absent in this image.
              printf '%s\n' \
                '/* stub: vendor ADSL blob is not part of this repository */' \
                'int mm_sendEOCmessage(void) { return 0; }' \
                'int mm_getEOCrxmessage(void) { return 0; }' \
                'int sendToPort0(void) { return 0; }' \
                'void EnterHeavyTraffic(void) { }' \
                'void ExitHeavyTraffic(void) { }' \
                > "$KBSP/adsl.c"
              make subdirs rootfs romfs V=1
            else
              echo "Failure was not the missing adsl source; see diagnostics above."
              exit 1
            fi
          fi

      - name: Collect firmware images
        if: success()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          find "$GITHUB_WORKSPACE/RTL8676xx" \
            \( -name '*.img' -o -name '*.bin' -o -name '*.image' -o -name 'vmlinux*' -o -name '*.squashfs' \) \
            -newer "$GITHUB_WORKSPACE/RTL8676xx/Makefile" \
            -exec cp -v --parents {} "$GITHUB_WORKSPACE/out/" \; || true

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
