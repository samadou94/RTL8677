name: Build RTL8677 repeater firmware

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            flex \
            bison \
            gperf \
            subversion \
            ncurses-dev \
            libncurses5-dev \
            libattr1-dev

      - name: Prepare legacy SDK
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          SDK="$ROOT/RTL8676xx"
          RSDK="$ROOT/rsdk-1.5.6-5281-EB-2.6.30-0.9.30.3-110915"

          cd "$SDK"

          # Normalize legacy files.
          perl -pi -e 's/\r$//' \
            Makefile tools/mkbuilddir tools/prepareBLP.sh scripts/Makefile

          # Fix Bash-only syntax in scripts that get run by /bin/sh (dash).
          perl -pi -e 's/^source /. /' \
            tools/mkbuilddir tools/prepareBLP.sh
          # "function foo" -> "foo()"  (fixes: mkbuilddir: 9: function: not found)
          perl -pi -e 's/^(\s*)function\s+(\w+)\s*(?:\(\s*\))?/$1$2()/' \
            tools/mkbuilddir tools/prepareBLP.sh
          # Also make the shebang bash in case they are executed directly.
          sed -i '1s|^#!.*|#!/bin/bash|' tools/mkbuilddir tools/prepareBLP.sh

          # Skip SVN status command: GitHub checkout is not an SVN working copy.
          perl -pi -e 's/SVNST=`svn st \$\$defconfig`;/SVNST=;/' Makefile

          # Fix legacy shell test syntax.
          perl -pi -e 's/\[ -a \.config \]/[ -e .config ]/g' Makefile

          # Neutralize the obsolete SUID permission check.
          sed -i '/^promission_check:$/,/^tools:/{/^promission_check:$/!{/^tools:/!d}}' Makefile
          sed -i '/^promission_check:$/c\promission_check: ; @echo "Skipping legacy SUID permission check"' Makefile
          sed -i '/^[[:space:]]*tools:[[:space:]]*promission_check[[:space:]]*$/c\tools:' Makefile

          # Fix SquashFS 4.1 for modern glibc / GCC.
          SQFS="tools/src/sqlzma/squashfs4.1/squashfs-tools/mksquashfs.c"
          SQFS_MK="tools/src/sqlzma/squashfs4.1/squashfs-tools/Makefile"
          test -f "$SQFS"

          perl -pi -e 'if ($. >= 1356 && $. <= 1374) { s/\bmajor\b(?!\s*\()/major_num/g; s/\bminor\b(?!\s*\()/minor_num/g }' "$SQFS"
          perl -pi -e 'if ($. >= 1380 && $. <= 1398) { s/\bmajor\b(?!\s*\()/major_num/g; s/\bminor\b(?!\s*\()/minor_num/g }' "$SQFS"

          if ! grep -q '^#include <sys/sysmacros.h>$' "$SQFS"; then
            perl -0pi -e 's/(#include <sys\/types\.h>\r?\n)/$1#include <sys\/sysmacros.h>\n/' "$SQFS"
          fi

          # GCC >= 5 uses C99/C11 inline rules: a non-static "inline" function
          # emits no symbol -> "undefined reference to `add_dir_entry'".
          # 1) make add_dir_entry a normal function
          perl -pi -e 's/^(?:static\s+)?inline\s+(void\s+add_dir_entry\b)/$1/' "$SQFS"
          # 2) build the tool with old GNU inline semantics, and pull in
          #    sys/sysmacros.h for every file (glibc >= 2.28 moved
          #    major/minor/makedev there -> "undefined reference to `makedev'").
          if ! grep -q 'fgnu89-inline' "$SQFS_MK"; then
            sed -i 's|-O2|-O2 -fgnu89-inline -include sys/sysmacros.h|' "$SQFS_MK"
          fi

          # Host expat (used by xmltool) is configured while the vendor
          # cross-toolchain env (AR/RANLIB/LD/NM/STRIP=rsdk-linux-*) is active,
          # so libexpat.a gets no index -> "archive has no index; run ranlib".
          # Force native binutils for that configure run.
          XMLMK="tools/src/mkxml/Makefile"
          test -f "$XMLMK"
          perl -pi -e 's{(?<![\w=])(\./configure\b)}{AR=ar RANLIB=ranlib LD=ld NM=nm STRIP=strip CC=gcc $1}' "$XMLMK"
          rm -rf tools/src/mkxml/xmlparser
          grep -q 'RANLIB=ranlib' "$XMLMK"

          # Linux 2.6.30 kernel/timeconst.pl uses defined(@array), which is a
          # fatal error in Perl >= 5.22 ("Can't use 'defined(@array)'").
          # Patch the real source file (the build tree only symlinks to it).
          TC="src/kernel/linux-2.6.30.9/kernel/timeconst.pl"
          test -f "$TC"
          perl -pi -e 's/defined\s*\(\s*(\@\w+)\s*\)/$1/g; s/defined\s+(\@\w+)/$1/g' "$TC"
          if grep -nE 'defined\s*\(?\s*@' "$TC"; then echo "timeconst.pl patch failed"; exit 1; fi

          # GNU make >= 4.3 made "mixed implicit and normal rules" (e.g.
          # "config %config:") a fatal error; busybox-1.6.1 and other legacy
          # kbuild-style Makefiles use it ("No rule to make target 'oldconfig'").
          # Split such rules into two rules with the same prerequisites/recipe.
          cat > /tmp/fix_mixed_rules.py <<'PYEOF'
          import re, sys
          p = sys.argv[1]
          lines = open(p, encoding='latin-1').read().split('\n')
          out, i, n = [], 0, 0
          hdr = re.compile(r'^([^\s#=:\t$][^:#=\t$]*?)\s*:(?![=:])(.*)$')
          while i < len(lines):
              l = lines[i]
              m = hdr.match(l)
              if m:
                  tg = m.group(1).split()
                  pats = [t for t in tg if '%' in t]
                  plain = [t for t in tg if '%' not in t]
                  if pats and plain:
                      head = [m.group(2)]
                      j = i + 1
                      while head[-1].rstrip().endswith('\\') and j < len(lines):
                          head.append(lines[j]); j += 1
                      rec = []
                      while j < len(lines) and (lines[j].startswith('\t') or
                            (lines[j].strip() == '' and j + 1 < len(lines) and lines[j + 1].startswith('\t'))):
                          rec.append(lines[j]); j += 1
                      for group in (plain, pats):
                          out.append(' '.join(group) + ':' + head[0])
                          out.extend(head[1:])
                          out.extend(rec)
                      n += 1
                      i = j
                      continue
              out.append(l)
              i += 1
          open(p, 'w', encoding='latin-1', newline='').write('\n'.join(out))
          print('%s: split %d mixed rule(s)' % (p, n))
          PYEOF
          find "$SDK/src" -type f \( -name Makefile -o -name 'Makefile.*' -o -name '*.mk' \) \
            \( -path '*/opensource/*' -o -path '*busybox*' \) \
            -exec python3 /tmp/fix_mixed_rules.py {} \; | grep -v ' split 0 ' || true

          # Ensure the host tools are rebuilt for this runner.
          rm -f "${SQFS%.c}.o"
          perl -pi -e 's/^OBJS = conf mconf$/OBJS = conf/' scripts/Makefile

          find tools/src -type f \
            \( -name '*.o' \
            -o -name 'mkimage_ex' \
            -o -name 'mkimage' \
            -o -name 'mksquashfs' \
            -o -name 'lzma' \
            -o -name 'formatcsv' \
            -o -name 'sstrip' \
            -o -name 'mktree' \
            -o -name 'xmltool' \
            -o -name 'xml_flash_tool' \) \
            -delete

          # Restore shipped Kconfig parser sources.
          cp -f scripts/lex.zconf.c_shipped scripts/lex.zconf.c
          cp -f scripts/zconf.tab.c_shipped scripts/zconf.tab.c
          cp -f scripts/zconf.hash.c_shipped scripts/zconf.hash.c

          # Set up the vendor toolchain path.
          test -d "$RSDK/bin"
          sudo mkdir -p /opt/tbs_toolchains/realtek
          sudo ln -sfn "$RSDK" \
            /opt/tbs_toolchains/realtek/rsdk-1.5.6-5281-EB-2.6.30-0.9.30.3-110915

          export PATH="$RSDK/bin:$PATH"
          echo "$RSDK/bin" >> "$GITHUB_PATH"

          # Enable RTL8192CD client and repeater support.
          CFG="$ROOT/customer/product/DSL2750U/defconfig"
          test -f "$CFG"

          for option in CONFIG_RTL_CLIENT_MODE_SUPPORT CONFIG_RTL_REPEATER_MODE_SUPPORT; do
            if grep -q "^# $option is not set$" "$CFG"; then
              sed -i "s/^# $option is not set$/$option=y/" "$CFG"
            elif ! grep -q "^$option=y$" "$CFG"; then
              printf '\n%s=y\n' "$option" >> "$CFG"
            fi
          done

          # Validate the expected configuration and patches.
          grep -Eq '^tools:[[:space:]]*$' Makefile
          grep -q 'unsigned int major_num = major(buf->st_rdev);' "$SQFS"
          grep -q 'unsigned int minor_num = minor(buf->st_rdev);' "$SQFS"
          ! grep -q 'unsigned int major = major(buf->st_rdev);' "$SQFS"
          ! grep -q 'unsigned int minor = minor(buf->st_rdev);' "$SQFS"
          grep -q '#include <sys/sysmacros.h>' "$SQFS"
          ! grep -Eq '^\s*(static\s+)?inline\s+void\s+add_dir_entry' "$SQFS"

          grep -q '^CONFIG_RTL8192CD=y$' "$CFG"
          grep -q '^CONFIG_RTL_VAP_SUPPORT=y$' "$CFG"
          grep -q '^CONFIG_RTL_CLIENT_MODE_SUPPORT=y$' "$CFG"
          grep -q '^CONFIG_RTL_REPEATER_MODE_SUPPORT=y$' "$CFG"
          grep -q '^TBS_KERNEL_VERSION=linux-2.6.30.9$' \
            "$ROOT/customer/product/DSL2750U/arch.mk"

          echo "=== VERIFIED PREPARATION ==="
          grep -n '^promission_check:' Makefile
          grep -n '^tools:' Makefile
          grep -n 'add_dir_entry' "$SQFS" | head -3
          grep -n 'sysmacros' "$SQFS_MK" || true
          grep -n 'RANLIB=ranlib' "$XMLMK"

      - name: Build
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          SDK="$ROOT/RTL8676xx"
          RSDK="$ROOT/rsdk-1.5.6-5281-EB-2.6.30-0.9.30.3-110915"

          export PATH="$RSDK/bin:$PATH"
          cd "$SDK"

          # Generate the product configuration.
          make autoprepare AUTOPRODUCT=DSL2750U V=1

          # Re-run the mixed-rule fix on any copies created under the build tree.
          find "$SDK"/build.DSL2750U/opensource -type f \( -name Makefile -o -name 'Makefile.*' -o -name '*.mk' \) \
            -exec python3 /tmp/fix_mixed_rules.py {} \; 2>/dev/null | grep -v ' split 0 ' || true

          # autoprepare may regenerate the Makefile; patch it again.
          sed -i '/^promission_check:$/,/^tools:/{/^promission_check:$/!{/^tools:/!d}}' Makefile
          sed -i '/^promission_check:$/c\promission_check: ; @echo "Skipping legacy SUID permission check"' Makefile
          sed -i '/^[[:space:]]*tools:[[:space:]]*promission_check[[:space:]]*$/c\tools:' Makefile

          echo "=== POST-AUTOPREPARE TARGET CHECK ==="
          sed -n '/^promission_check:/,/^tools:/p' Makefile
          grep -Eq '^tools:[[:space:]]*$' Makefile

          # Compile host tools, kernel subdirectories, and firmware filesystems.
          make tools V=1

          if ! make subdirs rootfs romfs V=1; then
            echo "::group::Diagnostics after failed kernel/rootfs build"
            KDIR="$(readlink -f build.DSL2750U/kernel/linux-2.6.30.9)"
            KBSP="$KDIR/arch/rlx/bsp"
            echo "KDIR=$KDIR"
            ls -la "$KBSP" || true
            echo "--- bsp Makefile (adsl lines) ---"
            grep -n -i 'adsl' "$KBSP/Makefile" || true
            echo "--- every adsl file in the checkout ---"
            find "$ROOT" -iname '*adsl*' -not -path '*/.git/*' 2>/dev/null | head -40 || true
            echo "::endgroup::"

            # "No rule to make target arch/rlx/bsp/adsl.o": the BSP Makefile
            # builds adsl.o but no adsl source/object exists in the repo (a
            # vendor ADSL file that was never committed). This repeater build
            # does not use ADSL, so build an empty adsl.o and continue.
            if [ -f "$KBSP/Makefile" ] \
               && grep -q 'adsl\.o' "$KBSP/Makefile" \
               && [ ! -e "$KBSP/adsl.c" ] && [ ! -e "$KBSP/adsl.S" ] \
               && [ ! -e "$KBSP/adsl.o" ] && [ ! -e "$KBSP/adsl.o_shipped" ]; then
              echo "adsl source missing -> creating stub adsl.c"
              # The vendor ADSL blob (adsl.o) also provides a few symbols that the
              # SAR/ATM driver and EOC code reference at the final vmlinux link
              # (mm_sendEOCmessage, mm_getEOCrxmessage, sendToPort0,
              # EnterHeavyTraffic, ExitHeavyTraffic). Provide no-op versions so the
              # kernel links; DSL line support is therefore absent in this image.
              printf '%s\n' \
                '/* stub: vendor ADSL blob is not part of this repository */' \
                'int mm_sendEOCmessage(void) { return 0; }' \
                'int mm_getEOCrxmessage(void) { return 0; }' \
                'int sendToPort0(void) { return 0; }' \
                'void EnterHeavyTraffic(void) { }' \
                'void ExitHeavyTraffic(void) { }' \
                > "$KBSP/adsl.c"
              make subdirs rootfs romfs V=1
            else
              echo "Failure was not the missing adsl source; see diagnostics above."
              exit 1
            fi
          fi

      - name: Collect firmware images
        if: success()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          find "$GITHUB_WORKSPACE/RTL8676xx" \
            \( -name '*.img' -o -name '*.bin' -o -name '*.image' -o -name 'vmlinux*' -o -name '*.squashfs' \) \
            -newer "$GITHUB_WORKSPACE/RTL8676xx/Makefile" \
            -exec cp -v --parents {} "$GITHUB_WORKSPACE/out/" \; || true

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rtl8677-repeater-firmware
          path: out/
          if-no-files-found: warn
